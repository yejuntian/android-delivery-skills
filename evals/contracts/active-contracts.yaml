version: 1
contracts:
  - id: latest-requirement-is-persisted
    status: active
    title: 用户最新需求必须进入唯一事实源
    kind: fact_source
    oracle: latest_user_requirement_is_persisted
    owner_files:
      - android-implement-and-verify/SKILL.md
      - _shared/android-global-rules.md
    applies_to:
      - code_mutation
      - route
      - final_delivery
    gate:
      blocks:
        - code_mutation
        - route
        - final_delivery
      satisfied_by:
        - requirement_persisted
      reset_by:
        - user_requirement_changed
    covered_by:
      artifact:
        - 002-docx-to-md-fact-source
      behavior:
        - behavior-001-blocks-code-before-confirmation
        - behavior-003-blocks-route-after-unsynced-change
      transcript:
        - transcript-002-lazy-code-before-confirmation
        - transcript-003-change-resets-old-confirmation

  - id: required-confirmations-before-route
    status: active
    title: 当前流程要求的确认未完成前不得拆 BDD、编码、route 或最终交付
    kind: confirmation_gate
    oracle: no_route_before_required_confirmations
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/delivery.py
      - scripts/implementation_plan.py
    applies_to:
      - code_mutation
      - route
      - final_delivery
    gate:
      blocks:
        - bdd_derivation
        - code_mutation
        - route
        - final_delivery
      satisfied_by:
        - requirement_confirmed
        - plan_confirmed
      reset_by:
        - user_requirement_changed
        - plan_changed
    covered_by:
      artifact:
        - 009-plan-confirmed-before-route
      behavior:
        - behavior-001-blocks-code-before-confirmation
        - behavior-002-allows-actions-after-confirmation
      transcript:
        - transcript-001-compliant-current-flow
        - transcript-002-lazy-code-before-confirmation
        - transcript-003-change-resets-old-confirmation
        - transcript-004-bdd-requires-confirmation
      command:
        - command-001-plan-confirmation-gate

  - id: stale-test-mapping-blocks-final
    status: active
    title: 需求义务变化后过期测试映射必须阻断最终通过
    kind: evidence_gate
    oracle: stale_mapping_blocks_final
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/test_mapping.py
      - scripts/delivery_gate.py
    applies_to:
      - final_delivery
    covered_by:
      artifact:
        - 004-stale-test-mapping-blocks-final
      command:
        - command-002-stale-mapping-blocks-final

  - id: zero-test-cannot-cover-obligation
    status: active
    title: 零测试或缺失测试报告不得冒充自动覆盖
    kind: anti_fake_green
    oracle: no_fake_green_from_zero_tests
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/execution_evidence.py
      - scripts/delivery_gate.py
    applies_to:
      - final_delivery
    covered_by:
      artifact:
        - 005-zero-test-fake-green-blocked
      command:
        - command-003-zero-test-fake-green-blocked

  - id: ui-visual-report-stays-independent
    status: active
    title: UI 视觉验收必须保持独立报告或明确豁免
    kind: routing_gate
    oracle: ui_visual_report_required
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/delivery.py
    applies_to:
      - route
      - final_delivery
    covered_by:
      artifact:
        - 007-ui-independent-report-required

  - id: conditional-gates-use-route-and-specialist-union
    status: active
    title: 条件门禁必须合并 route 候选和专项确认影响
    kind: routing_gate
    oracle: conditional_gate_union_is_complete
    owner_files:
      - scripts/delivery.py
      - scripts/delivery_gate.py
    applies_to:
      - final_delivery
    covered_by:
      artifact:
        - 008-route-specialist-union-gates
      command:
        - command-004-conditional-gate-union

  - id: fresh-evidence-required
    status: active
    title: 最终通过必须绑定当前需求、输入和最终代码的新鲜证据
    kind: evidence_freshness
    oracle: fresh_evidence_required
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/delivery_gate.py
      - scripts/execution_evidence.py
    applies_to:
      - final_delivery
    covered_by:
      command:
        - command-005-fresh-evidence-required

  - id: unverified-is-not-pass
    status: active
    title: 未验证、阻塞或设备待验项不能被声明为完整通过
    kind: anti_fake_green
    oracle: unverified_is_not_pass
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/delivery_gate.py
    applies_to:
      - final_delivery
    covered_by:
      command:
        - command-006-unverified-is-not-pass

  - id: impact-radius-blocks-out-of-scope-diff
    status: active
    title: 最终 diff 超出已确认影响半径必须阻断通过
    kind: scope_gate
    oracle: impact_radius_blocks_out_of_scope_diff
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/impact_radius.py
      - scripts/implementation_plan.py
      - scripts/delivery_gate.py
    applies_to:
      - code_mutation
      - route
      - final_delivery
    covered_by:
      artifact:
        - 011-impact-radius-blocks-out-of-scope-diff
      command:
        - command-007-impact-radius-out-of-scope-blocked

  - id: delivery-documents-are-evidence-not-code
    status: active
    title: 交付文档可以提交但不得参与代码脏区、路由或代码摘要
    kind: evidence_scope
    oracle: delivery_documents_excluded_from_code_diff
    owner_files:
      - android-implement-and-verify/SKILL.md
      - scripts/delivery.py
      - scripts/git_changes.py
      - scripts/execution_evidence.py
    applies_to:
      - check_env
      - route
      - final_delivery
    covered_by:
      artifact:
        - 012-document-evidence-not-code-diff

  - id: api-contract-pass-requires-contract-evidence
    status: active
    title: API 契约专项通过必须绑定契约来源、operation/schema、实现映射和 artifact
    kind: anti_fake_green
    oracle: api_contract_pass_requires_evidence
    owner_files:
      - android-verify-api-contract/SKILL.md
      - android-implement-and-verify/references/specialist-result.schema.json
      - scripts/specialist_result.py
      - scripts/delivery_gate.py
    applies_to:
      - route
      - final_delivery
    covered_by:
      artifact:
        - 013-api-contract-pass-requires-evidence

  - id: maintenance-evals-are-wired
    status: active
    title: 流程维护必须能运行本地 eval 回归
    kind: maintenance_gate
    oracle: maintenance_evals_are_wired
    owner_files:
      - _shared/android-global-rules.md
      - references/open-source-design-rationale.md
      - evals/runners/run_artifact_evals.py
      - scripts/validate_maintenance.py
      - scripts/maintenance_pre_commit.py
      - scripts/install_maintenance_hook.py
    applies_to:
      - skill_maintenance
    covered_by:
      artifact:
        - 010-maintenance-evals-wired
