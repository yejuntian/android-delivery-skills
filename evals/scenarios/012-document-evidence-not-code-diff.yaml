id: 012-document-evidence-not-code-diff
title: 交付文档可以提交但不算代码 diff
rubric: artifact-integrity-v1
checks:
  - name: check-env 展开未跟踪目录并忽略当前需求文档
    path: "scripts/delivery.py"
    contains:
      - "working_tree_status(project_path, untracked_files=\"all\")"
      - "交付文档改动已忽略"
      - "代码工作区干净"
  - name: route 基于过滤后的代码变更生成影响面
    path: "scripts/delivery.py"
    contains:
      - "route_changes = []"
      - "_path_excluded_from_delivery"
      - "route_signals={change.path: change.patch for change in route_changes}"
  - name: 执行收据排除 document 证据目录避免自污染
    path: "scripts/execution_evidence.py"
    contains:
      - "delivery_snapshot_exclusions(project_path, requirement_dir)"
      - "result_path.parent.parent"
  - name: 回归测试覆盖 document 证据规则
    paths:
      - "scripts/tests/test_delivery.py"
      - "scripts/tests/test_execution_evidence.py"
    contains:
      - "test_check_env_allows_current_document_evidence_without_code_dirty"
      - "test_route_ignores_document_only_changes"
      - "test_document_receipts_do_not_pollute_code_snapshot"
