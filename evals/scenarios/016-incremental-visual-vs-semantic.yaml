id: 016-incremental-visual-vs-semantic
title: 增量闭环区分纯视觉资料变化与需求语义变化
rubric: artifact-integrity-v1
checks:
  - name: 流程契约保留原需求闭环并定向失效纯视觉证据
    path: "references/delivery-flow.yaml"
    contains:
      - "id: requirement-semantics-changed"
      - "当前需求初始 Git 基线"
      - "未受影响需求义务及其 CURRENT 测试映射"
      - "受影响测试映射并标记 STALE"
      - "id: figma-visual-source-changed"
      - "影响半径未变化时的计划收据"
      - "Figma XML 产物交接结果"
      - "绑定旧输入的专项和执行收据"
      - "id: figma-behavior-changed"
  - name: 总入口只对业务语义变化重走需求与计划确认
    path: "android-implement-and-verify/SKILL.md"
    contains:
      - "Figma 只改变颜色、间距、字号或图片时按此处理"
      - "Figma 新增状态、交互或业务语义时必须回到"
      - "受影响映射进入 `STALE`"
      - "未变化的 BDD、代码和测试不重做"
  - name: Figma 链接与本地 UI 资料继续进入输入摘要
    path: "scripts/requirement_inputs.py"
    contains:
      - "ui"
      - "local_sources"
      - "requirement_inputs_digest"
      - "远程链接只绑定 URL"
