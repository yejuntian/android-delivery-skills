id: command-007-impact-radius-out-of-scope-blocked
title: 影响半径外最终 diff 被命令门禁阻断
type: command
rubric: command-gate-v1
checks:
  - name: 最终门禁拒绝影响半径外文件
    command:
      - python3
      - -m
      - unittest
      - scripts.tests.test_delivery_gate.DeliveryGateTests.test_out_of_scope_diff_blocks_passing_result
      - -q
    expect:
      exit_code: 0
      combined_not_contains:
        - Traceback
  - name: 影响半径工具可报告越界文件
    command:
      - python3
      - -m
      - unittest
      - scripts.tests.test_impact_radius.ImpactRadiusTests.test_outside_file_is_reported
      - -q
    expect:
      exit_code: 0
      combined_not_contains:
        - Traceback
