id: 008-route-specialist-union-gates
title: route 候选与专项确认影响取并集，不能漏条件 gate
rubric: artifact-integrity-v1
checks:
  - name: route 不为所有能力新增万能 Skill
    path: "scripts/delivery.py"
    contains:
      - "specialist_tasks = route_payload[\"specialist_tasks\"]"
      - "route 只登记，不执行"
  - name: 最终门禁合并专项语义触发的条件 gate
    path: "scripts/delivery_gate.py"
    contains:
      - "expected_conditional_gates.update("
      - "conditional_gates_from_confirmed_impacts(result)"
      - "通过结论缺少路由或语义触发的条件交付门禁"
