id: command-003-zero-test-fake-green-blocked
title: 零测试不能作为自动覆盖证据
type: command
rubric: command-gate-v1
checks:
  - name: delivery_gate 要求自动义务证据有实际执行测试
    command:
      - python3
      - -m
      - unittest
      - scripts.tests.test_delivery_gate.DeliveryGateTests.test_automated_obligation_requires_nonzero_test_count
      - -q
    expect:
      exit_code: 0
      combined_not_contains:
        - Traceback
