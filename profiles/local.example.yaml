# Android Delivery Skills 本机配置（极简版）
#
# 设计：约定优于配置。大多数字段由 new-requirement 命令自动生成 + config_paths 缺省推导。
# 用户只需关注 project_path；UI/接口资料不写在这里，通过对话提供给 AI，AI 固定到需求目录。
#
# 推荐用法：一句话开需求（AI 替你跑命令，你不用手填这个文件）
#   delivery.py new-requirement videoFeed --project /path/to/android-project --docx ~/xxx.docx
# 命令会自动：建 document/<日期>-<需求名>/、挪 docx、探测 git 分支和模块、生成本文件。
#
# 下列字段缺省时自动推导（无需手填）：
#   workspace_root   → project_path（项目内通道）
#   requirement_dir  → project_path/document/<今天>-<requirement_name>
#   requirement_file → requirement.docx（约定名）
#   branch           → 探测当前 git 分支
#   testing.module   → 探测 settings.gradle 的 include
#   mode/keep_completed/cache_retention/route.max_rounds → 用默认值
#
# UI/API 链接不再写在这里：对话里发给 AI，AI 存到 <requirement_dir>/ui/ 和 api/。

# 必填：当前 Android 项目根目录（含 settings.gradle）。
project_path: "/absolute/path/to/android-project"

# 需求名：用于推导 requirement_dir。通常由 new-requirement 命令写入，不必手填。
requirement_name: "your-requirement"

# 可选：UI 设计链接。不写在这里，对话发给 AI 即可。
# ui:
#   links: []

# 可选：接口契约链接。不写在这里，对话发给 AI 即可。
# api:
#   links: []
