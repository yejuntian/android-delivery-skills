id: command-006-unverified-is-not-pass
title: 未验证或阻塞项不能声明完整通过
type: command
rubric: command-gate-v1
checks:
  - name: FULL_PASS 不能保留未验证专项能力
    command:
      - python3
      - -m
      - unittest
      - scripts.tests.test_delivery_gate.DeliveryGateTests.test_full_pass_rejects_unverified_optional_specialist_capability
      - -q
    expect:
      exit_code: 0
      combined_not_contains:
        - Traceback
  - name: 已上线业务保护未验证会阻断通过结论
    command:
      - python3
      - -m
      - unittest
      - scripts.tests.test_delivery_gate.DeliveryGateTests.test_unverified_existing_business_protection_blocks_passing
      - -q
    expect:
      exit_code: 0
      combined_not_contains:
        - Traceback
