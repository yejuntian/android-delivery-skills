# Android Delivery 单需求配置示例。
# 单需求可复制为 profiles/local.yaml；并行需求分别复制为有意义的 profiles/<需求>.yaml。
# 本机配置必须被 Git 忽略。

# 必填：Android Git 项目根目录。
project_path: "/absolute/path/to/android-project"

# 必填：稳定需求名，用于首次推导工作目录。
requirement_name: "feature-name"

# 可选：省略时 Agent 先复用唯一匹配的 document/*-<requirement_name>/；
# 多个匹配时由用户选择；没有匹配才推导日期目录，随后写回绝对路径。
# requirement_dir: "/absolute/path/to/android-project/document/YYYY-MM-DD-feature-name"

# 可选：长期复用的 UI/API 链接；本轮聊天提供的输入同样有效。
# ui:
#   links: []
# api:
#   links: []
