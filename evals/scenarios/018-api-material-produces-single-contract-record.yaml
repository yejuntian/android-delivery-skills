id: 018-api-material-produces-single-contract-record
title: 用户提供 API 资料后生成或更新唯一契约记录
rubric: artifact-integrity-v1
checks:
  - name: 共享规则把用户提供 API 资料视为处理意图
    path: "_shared/android-global-rules.md"
    contains:
      - "用户为当前需求提供 API 链接、截图、文件或聊天契约时"
      - "`<requirement_dir>/docs/api.md`"
      - "已有文档只合并当前接口，不覆盖其他接口"
  - name: 需求规则分离契约记录和唯一需求事实源
    path: "android-implement-and-verify/references/requirement-and-plan.md"
    contains:
      - "生成或增量更新唯一 `docs/api.md`"
      - "`requirement_file` 仍是唯一需求事实"
  - name: API 专项不得重复询问或覆盖其他 operation
    path: "android-verify-api-contract/SKILL.md"
    contains:
      - "不再询问“是否需要处理接口”"
      - "文档已存在时只更新当前 operation"
      - "登记到 `api.files`"
  - name: 结构化响应树必须完整展开后再判断契约缺失
    path: "android-verify-api-contract/SKILL.md"
    contains:
      - "对 object 和 array 节点递归展开到叶子字段"
      - "只表示“尚未读完”"
      - "先重新核对展开和滚动状态"
  - name: API 模板保留来源、冲突和未知项
    path: "android-implement-and-verify/templates/api.md"
    contains:
      - "本文记录接口来源实际证明的契约、冲突和未知项"
      - "## 来源"
      - "## 冲突与处置"
      - "## 待确认问题"
  - name: 流程目录区分唯一契约记录与原始证据
    path: "docs/FLOW_OVERVIEW.md"
    contains:
      - "收到 API 资料时创建或更新：契约、来源、冲突与未知项"
      - "原始 JSON/OpenAPI/YApi 导出、截图和抓包等原形证据"
      - "不生成重复契约摘要"
  - name: 旧的不生成本地 API 文档规则已移除
    paths:
      - "_shared/android-global-rules.md"
      - "android-implement-and-verify/references/requirement-and-plan.md"
      - "android-verify-api-contract/SKILL.md"
    not_contains:
      - "不强制生成本地 API 文档"
      - "不额外生成本地 API 文档"
