id: behavior-flow-v1
name: Android Delivery behavior flow gates
purpose: >
  使用当前 active contract 的 gate 声明验证 AI 行为事件没有提前越过流程门禁，
  让流程改名、合并或删除时主要修改契约而不是重写场景。
pass_criteria:
  - 正向 trace 在满足当前 gate 后允许编码、route 或最终交付。
  - 反向 trace 必须被对应 contract 阻断，证明 Oracle 能抓住偷懒行为。
  - 场景只描述行为事件，不复制 Skill 的完整流程文字。
non_goals:
  - 不替代真实模型 forward test。
  - 不解析自然语言聊天记录。
  - 不运行 Android 构建、设备或真实交付脚本。
