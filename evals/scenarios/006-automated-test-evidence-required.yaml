id: 006-automated-test-evidence-required
title: 自动化测试证据阻断无测试的通过结论
rubric: artifact-integrity-v1
checks:
  - name: 总入口不再使用风险等级路由
    path: "android-implement-and-verify/SKILL.md"
    contains:
      - "自动化测试按 BDD、实际 diff 和影响类别选择"
      - "每个适用类别必须有当前版本的执行证据"
    not_contains:
      - "L1/L2/L3"
      - "PIT"
  - name: 专项结果只接受自动化测试证据
    paths:
      - "scripts/specialist_result.py"
      - "android-implement-and-verify/references/specialist-result.schema.json"
    contains:
      - "实际自动化测试证据"
    not_contains:
      - "mutation_testing"
      - "pitest"
