version: 1
title: Android Delivery 五步交付状态机
user_steps:
  - id: confirm-requirement
    label: 确认需求
    command: delivery.py init / check-env / confirm-requirement-update
    human_checkpoint: true
  - id: confirm-plan
    label: 拆分测试与确认计划
    command: delivery.py confirm-plan / init-test-mapping
    human_checkpoint: true
  - id: implement-verify
    label: 实现验证
    command: Red / 最小实现 / Green / 受影响验证
    human_checkpoint: false
  - id: incremental-reentry
    label: 变更后增量循环
    command: 按变化类型回到需求、计划或局部验证
    human_checkpoint: conditional
  - id: final-delivery
    label: 最终交付
    command: delivery.py route / delivery_gate.py assemble
    human_checkpoint: explicit-trigger
states:
  - DRAFT_REQUIREMENT
  - REQUIREMENT_CONFIRMED
  - PLAN_CONFIRMED
  - IMPLEMENTING
  - VERIFIED
  - ROUTED
  - DELIVERED
transitions:
  - from: DRAFT_REQUIREMENT
    to: REQUIREMENT_CONFIRMED
    trigger: 用户确认已经写回事实源的需求
  - from: REQUIREMENT_CONFIRMED
    to: PLAN_CONFIRMED
    trigger: 用户确认实施计划和影响半径
  - from: PLAN_CONFIRMED
    to: IMPLEMENTING
    trigger: 测试映射建立且先观察 Red
  - from: IMPLEMENTING
    to: VERIFIED
    trigger: 最小实现 Green 且受影响验证完成
  - from: VERIFIED
    to: ROUTED
    trigger: 用户明确要求最终交付并完成最终影响路由
  - from: ROUTED
    to: DELIVERED
    trigger: 所有适用专项和最终门禁形成诚实结论
invalidation_events:
  - id: requirement-semantics-changed
    label: 需求语义变化
    preserves:
      - 当前需求初始 Git 基线
      - 未受影响需求义务及其 CURRENT 测试映射
    invalidates:
      - 当前需求确认状态
      - 旧计划收据
      - 受影响测试映射并标记 STALE
      - 旧 route、专项结果和最终证据
    resumes_at: DRAFT_REQUIREMENT
  - id: plan-or-radius-changed
    label: 实施计划或影响半径变化
    preserves:
      - 已确认需求修订
    invalidates:
      - 旧计划收据
      - 旧 route、专项结果和最终证据
    resumes_at: REQUIREMENT_CONFIRMED
  - id: figma-visual-source-changed
    label: Figma 只改变已确认范围内的视觉资料
    preserves:
      - 已确认需求修订
      - 影响半径未变化时的计划收据
      - 未受影响 BDD 测试映射
    invalidates:
      - Figma XML 产物交接结果
      - UI 构建、截图和视觉验收证据
      - requirement_inputs_sha256 变化时绑定旧输入的专项和执行收据
      - 旧 route 和最终结论
    resumes_at: PLAN_CONFIRMED
  - id: implementation-detail-changed
    label: 已确认范围内的实现细节变化
    preserves:
      - 已确认需求和计划
      - 未受影响测试映射
    invalidates:
      - 受影响执行收据
      - 旧 route、专项结果和最终结论
    resumes_at: IMPLEMENTING
  - id: figma-behavior-changed
    label: Figma 新增状态、交互、文案语义或业务规则
    preserves:
      - 当前需求初始 Git 基线
      - 未受影响需求义务、代码和 CURRENT 测试映射
    invalidates:
      - 当前需求确认状态
      - 旧计划收据
      - 受影响测试映射并标记 STALE
      - 旧 route、专项结果和最终证据
    resumes_at: DRAFT_REQUIREMENT
commands:
  - phase: 确认需求
    command: delivery.py init
  - phase: 确认需求
    command: delivery.py check-env
  - phase: 确认需求
    command: delivery.py confirm-requirement-update
  - phase: 确认计划
    command: delivery.py confirm-plan
  - phase: 实现验证
    command: delivery.py init-test-mapping
  - phase: 最终交付
    command: delivery.py route
  - phase: 最终交付
    command: delivery_gate.py assemble
outcomes:
  - FULL_PASS
  - LOCAL_PASS_DEVICE_PENDING
  - INCOMPLETE
  - BLOCKED
invariants:
  - 聊天不是需求事实源，最新需求必须先写回 requirement_file。
  - 需求和计划确认前不得修改生产代码。
  - STALE 测试映射不得支持最终通过。
  - 最终 diff 超出影响半径必须阻断。
  - route 只登记专项任务，不直接调用 Skill。
  - 最终通过必须绑定当前需求、计划、输入和代码的新鲜证据。
  - figma-android-xml 只生产 XML 和资源，不输出最终视觉 PASS。
