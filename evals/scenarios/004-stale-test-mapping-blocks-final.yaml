id: 004-stale-test-mapping-blocks-final
title: 需求义务变更后 STALE 测试映射阻断最终通过
rubric: artifact-integrity-v1
checks:
  - name: 需求修订后脚本会标记 STALE
    path: "scripts/test_mapping.py"
    contains:
      - "mark_stale_after_revision"
      - "entry[\"mapping_status\"] = \"STALE\""
      - "需求增量使该义务语义变化"
  - name: 最终门禁拒绝 STALE 映射
    path: "scripts/delivery_gate.py"
    contains:
      - "entry[\"mapping_status\"] == \"STALE\""
      - "测试映射过期：需求已增量但测试未同步"
      - "测试映射登记了未执行的测试"
