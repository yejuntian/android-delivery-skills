id: 010-maintenance-evals-wired
title: 流程维护时本地 artifact Evals 已接线
rubric: artifact-integrity-v1
checks:
  - name: 共享规则声明统一维护验证命令
    path: "_shared/android-global-rules.md"
    contains:
      - "python3 scripts/validate_maintenance.py"
      - "统一运行规则归属测试和 fast eval"
      - "普通 Android 需求没有修改流程仓库时不运行"
  - name: 维护验证脚本统一接线规则测试和 fast eval
    path: "scripts/validate_maintenance.py"
    contains:
      - "scripts.tests.test_skill_rule_ownership"
      - "evals/runners/run_evals.py"
      - "--suite"
      - "fast"
  - name: 设计依据声明维护门禁不接入普通 delivery.py
    path: "references/open-source-design-rationale.md"
    contains:
      - "可由仓库产物直接证明的不变量用 `evals/runners/run_artifact_evals.py` 做本地确定性 Evals"
      - "python3 scripts/validate_maintenance.py"
      - "这些维护门禁不接入 `delivery.py`"
      - "普通 Android 需求没有修改流程仓库时不运行"
