id: 014-parallel-worktree-channel-guard
title: 并行需求阻断同一物理 worktree 并允许不同 worktree
rubric: artifact-integrity-v1
checks:
  - name: 总入口声明物理 worktree 通道保护
    path: "android-implement-and-verify/SKILL.md"
    contains:
      - "原子占用当前物理 worktree 路径"
      - "不同 worktree 即使属于同一 Git 仓库也允许并行"
      - "后续 `route` 会复核占用身份，最终 gate 继续复核 route 快照、Git 基线和当前代码摘要"
  - name: 通道模块按 worktree 路径原子 claim
    path: "scripts/channel_guard.py"
    contains:
      - "CHANNEL_LOCK_ROOT"
      - "os.O_CREAT | os.O_EXCL"
      - "同一需求重复进入幂等"
      - "def assert_channel"
      - "def release_channel"
  - name: check-env 与 route 接入通道校验
    paths:
      - "scripts/delivery.py"
      - "scripts/requirement_workspace.py"
    contains:
      - "claim_channel"
      - "assert_channel"
      - "release_channel"
  - name: 回归覆盖同 worktree 阻断和不同 worktree 并行
    path: "scripts/tests/test_channel_guard.py"
    contains:
      - "test_same_worktree_is_exclusive_but_same_channel_is_idempotent"
      - "test_different_worktrees_can_run_in_parallel"
      - "test_check_env_blocks_two_configs_on_one_worktree"
  - name: 并行集成保持线性主干规则
    paths:
      - "android-implement-and-verify/SKILL.md"
      - "references/open-source-design-rationale.md"
      - "scripts/requirement_workspace.py"
    contains:
      - "git merge --ff-only"
      - "私有分支集成前一次 `git rebase`"
