id: 007-ui-independent-report-required
title: UI 视觉验收保持独立任务，不被 Journey 或 route 执行遗漏
rubric: artifact-integrity-v1
checks:
  - name: route 输出中 UI 验收登记为独立必需任务
    path: "scripts/delivery.py"
    contains:
      - "专项任务清单（已写入路由影响快照；route 只登记，不执行）"
      - "specialist_tasks = route_payload[\"specialist_tasks\"]"
      - "gate_label(task['gate_id'])"
      - "必需 | 待执行"
      - "UI 验收由独立 Skill 执行；界面流程功能测试由自动化测试 Skill 负责。"
  - name: 总入口最终门禁要求独立 UI 报告或豁免
    path: "android-implement-and-verify/SKILL.md"
    contains:
      - "必须附上独立 `android-verify-ui` 报告或用户明确豁免"
      - "UI 验收待执行"
  - name: UI 报告采用轻量视觉链接，不绑定 APK 或截图哈希
    path: "android-verify-ui/SKILL.md"
    contains:
      - "Figma 链接"
      - "真机截图/差异图链接"
      - "不要求 APK hash、versionCode、安装收据、执行人"
  - name: UI 专项结果使用 visual_review 链接字段
    path: "scripts/specialist_result.py"
    contains:
      - "visual_review"
      - "只有 android-verify-ui 可以输出 visual_review"
