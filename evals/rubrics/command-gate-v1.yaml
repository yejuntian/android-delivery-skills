id: command-gate-v1
name: Android Delivery command gates
purpose: >
  使用仓库已有单元测试或最小脚本命令验证真实门禁逻辑仍然可执行，避免只靠文本规则或行为 trace。
pass_criteria:
  - 场景命令必须以参数数组形式运行，不能依赖 shell 字符串。
  - 命令退出码符合预期，且输出不包含 traceback 等配置错误。
  - 每个场景只证明一个高价值硬门禁。
non_goals:
  - 不替代全量 unittest。
  - 不运行真实 Android 构建、设备或用户项目。
  - 不调用模型或评估自然语言质量。
