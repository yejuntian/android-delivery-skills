id: 015-figma-xml-provider-handoff
title: Figma XML 是受影响半径约束的实现生产者，不冒充最终 UI 验收
rubric: artifact-integrity-v1
checks:
  - name: Skill catalog 把 Figma XML 定义为可选实现能力
    path: "references/skill-catalog.yaml"
    contains:
      - "id: figma-android-xml"
      - "role: implementation-provider"
      - "returns_to: android-implement-and-verify"
      - "android-verify-ui"
  - name: 总入口只在计划确认后的 XML 页面调用并接管
    paths:
      - "android-implement-and-verify/SKILL.md"
      - "android-implement-and-verify/references/figma-android-xml-handoff.md"
    contains:
      - "Compose 不调用 XML Skill"
      - "只生成 XML 和资源"
      - "生成成功不等于交付通过"
      - "figma_xml_handoff.py"
  - name: 交接门禁拒绝代码文件、越界文件、旧输入和被篡改产物
    path: "scripts/figma_xml_handoff.py"
    contains:
      - "figma-android-xml 不得交付 Kotlin/Java"
      - "Figma XML 产物超出已确认影响半径"
      - "requirement_inputs_sha256 已失效"
      - "Figma XML 产物 SHA-256 与实际文件不一致"
      - "必须位于 Android src/<sourceSet>/res 目录"
      - "before-snapshot"
      - "未在交接结果声明的改动"
      - "必须先进入需求修订闭环"
  - name: 导航和 setup 只能由用户显式调用
    paths:
      - "android-delivery-guide/agents/openai.yaml"
      - "android-delivery-setup/agents/openai.yaml"
    contains:
      - "allow_implicit_invocation: false"
  - name: 设计依据记录包装层和完整 Figma 交接边界
    path: "references/open-source-design-rationale.md"
    contains:
      - "M34 Skill 包装层、项目初始化与 Figma XML 交接"
      - "调用前记录 Git worktree"
      - "漏报文件、删除、代码或报告改动均阻断"
